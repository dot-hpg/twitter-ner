apiVersion: apps/v1
kind: Deployment
metadata:
  name: ner-api
  namespace: twitter-ner
  labels: {app: ner-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: ner-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # never drop below 2 serving pods during a rollout
  template:
    metadata:
      labels: {app: ner-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: ner-api
          image: twitter-ner-api:1.0          # local image; use ghcr.io/<user>/twitter-ner-api:<tag> on a remote cluster
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: ner-api-config}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe:                        # loading BERT takes a while; give it up to 3 minutes
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 3
